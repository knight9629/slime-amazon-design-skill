interface:
  display_name: "亚马逊设计师agent"
  short_description: "1.0.0 正式版：按画面/排版用途找参考，精选库优先，简单选择与换一批"
  default_prompt: "Use $amazon-ai-design-workflow-orchestrator version 1.0.0 in FULL_FLOW by default. Follow references/reference_discovery.md v2: search visual and layout purposes separately, retrieve explicitly liked favorites first and add fresh cases, inspect actual images and show only applicable 喜欢/一般/不喜欢 buttons. CONTINUE sets RATED when visual and layout have positive anchors; the controller then writes the hash-bound profile; RESEARCH_ALL replaces all and RESEARCH_REJECTED preserves likes while replacing the rest. No per-image user rationale, module assignment, extra profile approval, fixed source quota or generated pairwise gate. NATIVE_CHAT_FEEDBACK permits explicit chat actions and named sample/axis choices through chat-submit with exact user words; do not require repeated button clicks or infer unmentioned scores. Bind the pending pool hash and round, and bind style samples and production plans to the current profile. Preserve stable count_by_ratio, deferred/resolved Premium carousel and path/hash contracts. Use native DIRECT_IMAGE_INPUT with VISUAL_CONTEXT_RELAY plus NO VIEW_IMAGE INPUT only as fallback. Continue selected-style production in the same task via $amazon-image-production-runner, with no smoke gates, three thin image lanes and full raw-set QC. Stable export requires exact raw aspect ratio. Preserve CONTROLLER_SINGLE_WRITER and ONE_WORKER_ONE_SLOT. An explicit legacy selected-style project with no workflow-version marker and neither preference artifact follows its existing path and must not fabricate ratings."
policy:
  allow_implicit_invocation: true
