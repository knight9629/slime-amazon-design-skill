  short_description: "已选风格后的正式出图、集中 QC 与精确尺寸导出（1.0.0 正式版）"
  default_prompt: "使用 $amazon-image-production-runner（version 1.0.0）承接已确认风格的正式出图：读取当前项目的生产计划和偏好档案，生成全部图片、集中 QC，再导出精确尺寸。Contract: bind production_plan.json to the current v2 preference profile SHA-256; resolve Premium carousel mapping before prompts; Basic A+ is at most 5 standalone 970x600 images; apply BOUNDED_RATIO_EXPORT (raw within 1% of the target ratio is resized to exact pixels and recorded); preserve CONTROLLER_SINGLE_WRITER and ONE_WORKER_ONE_SLOT. An explicit legacy selected-style project with no workflow-version marker and neither preference artifact follows its existing path and must not fabricate ratings."
policy:
  allow_implicit_invocation: false
