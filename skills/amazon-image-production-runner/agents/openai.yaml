interface:
  display_name: "亚马逊完整出图"
  short_description: "1.0.0 正式版：承接 v2 偏好，保留轮播槽位与精确比例导出"
  default_prompt: "Use $amazon-image-production-runner version 1.0.0 for a confirmed selected-style handoff from the orchestrator or an explicit selected-style production request. For new 1.0.0 runs require the current approved v2 preference profile and bind production_plan.json to its SHA-256; follow applicable visual/layout anchors without extra reference rationale or generated pairwise gates. Read agentic-production, product-exposure, layout-matrix and slot-manifest contracts. Preserve separate count_by_ratio values, resolved Premium carousel mapping before prompts, and explicit carousel slide ids; Basic A+ is at most 7 standalone 960x600 images. Use exact local native referenced-image inputs; VISUAL_CONTEXT_RELAY with view_image and NO VIEW_IMAGE INPUT is fallback only. Apply the numeric 4:5 rule. Use no smoke gates, three thin image workers, one complete raw queue and three final QC profiles. Keep image copy/native copy/alt text/mobile readability separate. Export only exact-aspect raw images with same-aspect resize; write final manifests only when all requested slots pass and have hashes. An explicit legacy selected-style project with no workflow-version marker and neither preference artifact follows its existing path and must not fabricate ratings. Preserve CONTROLLER_SINGLE_WRITER and ONE_WORKER_ONE_SLOT."
policy:
  allow_implicit_invocation: false
